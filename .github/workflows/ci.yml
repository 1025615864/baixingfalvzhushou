name: CI Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend-v2/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'

  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false
        continue-on-error: true
      - uses: mtfoley/pr-compliance-action@v1
        with:
          body-regex: '(Fixes|Closes|Resolves) #\d+'
          body-fail: false
        continue-on-error: true

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: ./frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
        continue-on-error: true

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m compileall app/

  pyright:
    name: Pyright Type Check
    runs-on: ubuntu-latest
    needs: backend-check
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1
      - run: |
          python -m pip install --upgrade pip
          pip install pyright
          pip install -r backend/requirements.txt
      - run: |
          pyright -p pyrightconfig.json --outputjson > pyright.json || true
          python - <<'PY'
          import json
          import os
          import sys
          path = "pyright.json"
          if not os.path.exists(path):
              print("::error::pyright.json not generated (pyright may have crashed)")
              sys.exit(1)
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          diags = data.get("generalDiagnostics") or []
          has_error = False
          for d in diags[:200]:
              severity = (d.get("severity") or "error").lower()
              level = "error" if severity == "error" else "warning"
              if level == "error":
                  has_error = True
              file = d.get("file") or "pyright"
              rng = d.get("range") or {}
              start = rng.get("start") or {}
              line = (start.get("line") or 0) + 1
              col = (start.get("character") or 0) + 1
              msg = (d.get("message") or "").replace("\n", " ")
              print(f"::{level} file={file},line={line},col={col}::{msg}")
          print(f"Total diagnostics: {len(diags)}")
          sys.exit(1 if has_error else 0)
          PY

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v1
        with:
          args: --max-concurrency 1 docs/
        continue-on-error: true
      - uses: DavidAnson/markdownlint-cli2-action@v13
        with:
          globs: '**/*.md'
        continue-on-error: true

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-check]
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --upgrade pytest pytest-asyncio pytest-cov
      - run: python scripts/alembic_cmd.py upgrade head
        env:
          DEBUG: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: test-secret-key-change-me-32chars-minimum
          PAYMENT_WEBHOOK_SECRET: test-payment-webhook-secret
      - run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml:coverage.xml --cov-report=term:skip-covered --cov-fail-under=62
        env:
          DEBUG: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          PAYMENT_WEBHOOK_SECRET: test-payment-webhook-secret
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-check]
    defaults:
      run:
        working-directory: ./frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-v2/dist
          retention-days: 7

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-check]
    defaults:
      run:
        working-directory: ./frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run test:coverage || true
        continue-on-error: true
      - uses: codecov/codecov-action@v4
        with:
          files: frontend-v2/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        continue-on-error: true

  helm-validate:
    name: Helm Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
      - run: helm dependency build ./helm/baixing-assistant
      - run: helm lint ./helm/baixing-assistant
      - run: |
          set -euo pipefail
          helm template test ./helm/baixing-assistant \
            --namespace baixing \
            --set-string image.backend.repository=example/baixing-backend \
            --set-string image.backend.tag=ci \
            --set-string image.frontend.repository=example/baixing-frontend \
            --set-string image.frontend.tag=ci \
            --set-string backend.secret.DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/baixing_law \
            --set-string backend.secret.JWT_SECRET_KEY=dummy_jwt_secret_key \
            --set-string backend.secret.PAYMENT_WEBHOOK_SECRET=dummy_payment_webhook_secret \
            --set-string backend.secret.REDIS_URL=redis://redis:6379/0 \
            --set-string backend.secret.OPENAI_API_KEY=dummy_openai_api_key \
            --set-string ingress.host=example.com \
            > /tmp/helm-rendered.yaml

  schemathesis-api-test:
    name: Schemathesis API Test
    needs: [backend-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install schemathesis[cli]
      - run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          sleep 10
        env:
          DEBUG: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-change-me-32chars-minimum
          PAYMENT_WEBHOOK_SECRET: test-payment-webhook-secret
      - run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1
      - run: |
          schemathesis run http://localhost:8080/openapi.json \
            --checks all \
            --base-url http://localhost:8080 \
            --validate-schema \
            --verbosity verbose \
            --output-format cli \
            --junit-xml results/schemathesis-junit.xml \
            --json results/schemathesis-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemathesis-results
          path: |
            backend/results/
          retention-days: 7

  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    needs:
      [helm-validate, backend-test, frontend-build, frontend-test, schemathesis-api-test]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          echo "helm-validate=${{ needs.helm-validate.result }}"
          echo "backend-test=${{ needs.backend-test.result }}"
          echo "frontend-build=${{ needs.frontend-build.result }}"
          echo "frontend-test=${{ needs.frontend-test.result }}"
          echo "schemathesis-api-test=${{ needs.schemathesis-api-test.result }}"
          helm="${{ needs.helm-validate.result }}"
          backend="${{ needs.backend-test.result }}"
          frontend="${{ needs.frontend-build.result }}"
          ftest="${{ needs.frontend-test.result }}"
          schemathesis="${{ needs.schemathesis-api-test.result }}"
          if [ "$helm" != "success" ] || [ "$backend" != "success" ] || [ "$frontend" != "success" ]; then
            exit 1
          fi
          if [ "$schemathesis" = "success" ] || [ "$schemathesis" = "skipped" ]; then
            exit 0
          fi
          exit 1
