name: Code Quality Report

on:
  schedule:
    # 每周一早上8点运行
    - cron: '0 8 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============ 前端代码质量报告 ============
  frontend-quality:
    name: Frontend Quality Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate ESLint report
        run: npm run lint -- --format json --output-file eslint-report.json
        continue-on-error: true

      - name: Count ESLint issues
        run: |
          echo "## ESLint Statistics" >> $GITHUB_STEP_SUMMARY
          if [ -f eslint-report.json ]; then
            errors=$(cat eslint-report.json | jq '[.[].messages[] | select(.severity == 2)] | length')
            warnings=$(cat eslint-report.json | jq '[.[].messages[] | select(.severity == 1)] | length')
            echo "- Errors: $errors" >> $GITHUB_STEP_SUMMARY
            echo "- Warnings: $warnings" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ESLint report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-report
          path: ./frontend-v2/eslint-report.json
        continue-on-error: true

  # ============ 后端代码质量报告 ============
  backend-quality:
    name: Backend Quality Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term --cov-fail-under=60
        continue-on-error: true

      - name: Generate coverage report
        run: |
          echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            coverage=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2)
            percentage=$(echo "$coverage * 100" | bc)
            echo "- Coverage: ${percentage}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ./backend/coverage.xml
        continue-on-error: true

  # ============ 依赖安全扫描 ============
  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (frontend)
        working-directory: ./frontend-v2
        run: |
          npm audit --audit-level=high --json > npm-audit.json 2>/dev/null || true
          echo "## Frontend Security Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f npm-audit.json ]; then
            vulns=$(cat npm-audit.json | jq '.metadata.vulnerabilities.total // 0')
            echo "- Total vulnerabilities: $vulns" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit (backend)
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit --format=json --output=pip-audit.json || true
          echo "## Backend Security Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit.json ]; then
            vulns=$(cat pip-audit.json | jq '.dependencies | length // 0')
            echo "- Total vulnerabilities: $vulns" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            ./frontend-v2/npm-audit.json
            ./backend/pip-audit.json
        continue-on-error: true

  # ============ 生成综合报告 ============
  generate-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality, dependency-security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Count lines of code
        run: |
          echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          frontend_ts=$(find frontend-v2/src -name '*.ts' -o -name '*.tsx' | xargs wc -l | tail -1 | awk '{print $1}')
          frontend_css=$(find frontend-v2/src -name '*.css' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          echo "- TypeScript/TSX: $frontend_ts lines" >> $GITHUB_STEP_SUMMARY
          echo "- CSS: ${frontend_css:-0} lines" >> $GITHUB_STEP_SUMMARY
          
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          backend_py=$(find backend/app -name '*.py' | xargs wc -l | tail -1 | awk '{print $1}')
          echo "- Python: $backend_py lines" >> $GITHUB_STEP_SUMMARY
          
          echo "### Documentation" >> $GITHUB_STEP_SUMMARY
          docs_md=$(find docs -name '*.md' | xargs wc -l | tail -1 | awk '{print $1}')
          echo "- Markdown: $docs_md lines" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Post summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Report generated on $(date)" >> $GITHUB_STEP_SUMMARY
