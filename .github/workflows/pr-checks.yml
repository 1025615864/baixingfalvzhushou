name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  # ============ 变更文件检测 ============
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend-v2/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'

  # ============ 前端快速检查 ============
  frontend-check:
    name: Frontend Quick Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: ./frontend-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint check
        run: npm run lint
        continue-on-error: true

  # ============ 后端快速检查 ============
  backend-check:
    name: Backend Quick Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall app/

  # ============ 文档检查 ============
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --max-concurrency 1 docs/
        continue-on-error: true

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v13
        with:
          globs: '**/*.md'
        continue-on-error: true

  # ============ PR信息检查 ============
  pr-check:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false
        continue-on-error: true

      - name: Check PR description
        uses: mtfoley/pr-compliance-action@v1
        with:
          body-regex: '(Fixes|Closes|Resolves) #\d+'
          body-fail: false
        continue-on-error: true
