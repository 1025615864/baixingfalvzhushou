name: Release & Deploy

on:
  push:
    tags:
      - "v*.*.*"
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: false
        default: ""
      push_images:
        description: "PUSH_IMAGES=1 to publish Docker images to GHCR"
        required: false
        default: "0"
      strict:
        description: "STRICT=1 for post-deploy smoke: require highlights/keywords non-empty"
        required: false
        default: "0"
      poll_seconds:
        description: "POLL_SECONDS for smoke script"
        required: false
        default: "30"

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      push_images: ${{ steps.flags.outputs.push_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          TAG="${REF_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${INPUT_TAG:-}"; fi
          if [ -z "$TAG" ]; then
            TAG="v0.0.0-dev-${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - id: flags
        env:
          INPUT_PUSH_IMAGES: ${{ github.event.inputs.push_images }}
          SECRET_GHCR_PUBLISH: ${{ secrets.GHCR_PUBLISH }}
        run: |
          set -euo pipefail
          PUSH_IMAGES="0"
          if [ "${INPUT_PUSH_IMAGES:-0}" = "1" ]; then PUSH_IMAGES="1"; fi
          if [ "${SECRET_GHCR_PUBLISH:-0}" = "1" ]; then PUSH_IMAGES="1"; fi
          echo "push_images=$PUSH_IMAGES" >> "$GITHUB_OUTPUT"

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
        continue-on-error: true

  backend-lint:
    name: Backend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - run: black --check app/
        continue-on-error: true
      - run: isort --check-only app/
        continue-on-error: true
      - run: ruff check app/
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: ./frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-v2/dist
          retention-days: 7

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
      - uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  microservice-tests:
    name: Microservice Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    strategy:
      matrix:
        service:
          - name: news
            dir: ./services/news-service
            db_port: 5433
          - name: search
            dir: ./services/search-service
            db_port: 0
          - name: legal
            dir: ./services/legal-service
            db_port: 5435
          - name: community
            dir: ./services/community-service
            db_port: 5436
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service.dir }}/requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio httpx
      - run: pytest tests/ -v --tb=short
        working-directory: ${{ matrix.service.dir }}
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    strategy:
      matrix:
        service:
          - context: ./frontend-v2
            tag: baixing-frontend
          - context: ./backend
            tag: baixing-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ matrix.service.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test, docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend-v2
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/baixing-frontend:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/baixing-frontend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/baixing-backend:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/baixing-backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: appleboy/ssh-action@v1.0.3
        if: github.event_name != 'pull_request'
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/baixing-assistant
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
            docker system prune -f
      - run: |
          sleep 30
          curl -f https://staging.baixing.com/health || exit 1
          curl -f https://staging.baixing.com/api/health || exit 1
        if: github.event_name != 'pull_request'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, frontend-build, backend-test, docker-build, security-scan]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json
      - run: |
          set -euo pipefail
          npm --prefix frontend-v2 ci
          npm --prefix frontend-v2 run build
        env:
          CI: "1"
      - run: |
          set -euo pipefail
          mkdir -p dist
          (cd frontend-v2 && zip -r "../dist/frontend-dist-${{ needs.resolve-tag.outputs.tag }}.zip" dist)
      - uses: azure/setup-helm@v4
      - run: |
          set -euo pipefail
          mkdir -p dist
          helm dependency build ./helm/baixing-assistant
          helm package ./helm/baixing-assistant --destination dist
      - uses: docker/setup-buildx-action@v3
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
      - uses: docker/login-action@v3
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image names
        id: img
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER=$(echo "$REPO" | cut -d/ -f1)
          echo "backend=ghcr.io/${OWNER}/baixing-backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=ghcr.io/${OWNER}/baixing-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/baixing-frontend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=ghcr.io/${OWNER}/baixing-frontend:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        with:
          context: ./backend
          push: false
          load: true
          tags: baixing-backend:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@master
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        with:
          image-ref: 'baixing-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
      - uses: docker/build-push-action@v5
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.backend }}
            ${{ steps.img.outputs.backend_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        if: ${{ needs.resolve-tag.outputs.push_images == '1' }}
        with:
          context: ./frontend-v2
          push: true
          tags: |
            ${{ steps.img.outputs.frontend }}
            ${{ steps.img.outputs.frontend_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="docs/CHANGELOG.md"
          if [ -f "$FILE" ]; then
            if grep -q "^## \\[$TAG\\]" "$FILE"; then
              awk -v tag="$TAG" 'BEGIN{p=0} $0 ~ "^## \\[" tag "\\]"{p=1;next} $0 ~ "^## \\[" && p==1{exit} p==1{print}' "$FILE" > /tmp/release_notes.md
            else
              awk 'BEGIN{p=0} $0 ~ "^## \\[Unreleased\\]"{p=1;next} $0 ~ "^## \\[" && p==1{exit} p==1{print}' "$FILE" > /tmp/release_notes.md
            fi
            sed -i '1{/^$/d;}' /tmp/release_notes.md
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "notes=Release $TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/frontend-dist-${{ needs.resolve-tag.outputs.tag }}.zip
            dist/*.tgz
          draft: false
          prerelease: false

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/baixing-assistant
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --build backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend alembic upgrade head || true
            docker system prune -f
      - run: |
          sleep 60
          curl -f https://baixing.com/health || exit 1
          curl -f https://baixing.com/api/health || exit 1

  post-deploy-smoke:
    name: Post Deploy Smoke
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-news-ai.sh
          ./scripts/smoke-news-ai.sh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          STRICT: ${{ inputs.strict || '0' }}
          POLL_SECONDS: ${{ inputs.poll_seconds || '30' }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '1' }}
