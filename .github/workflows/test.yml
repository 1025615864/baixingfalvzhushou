name: Tests

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'backend/**'
      - 'frontend-v2/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'backend/**'
      - 'frontend-v2/**'
      - '.github/workflows/test.yml'

jobs:
  # 后端测试
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          pip install ruff
          ruff check . --ignore E501,W293,W291 --exit-zero || true

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -v --tb=short -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        continue-on-error: true

  # 前端测试
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || true
        continue-on-error: true

      - name: Run type check
        run: npm run type-check || true
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:coverage || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend-v2/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        continue-on-error: true

  # 测试结果汇总
  test-summary:
    name: Test Summary
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 测试类型 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端测试 | ${{ needs.backend-tests.result == 'success' && '✅ 通过' || '⚠️ 检查详情' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端测试 | ${{ needs.frontend-tests.result == 'success' && '✅ 通过' || '⚠️ 检查详情' }} |" >> $GITHUB_STEP_SUMMARY
