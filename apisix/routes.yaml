  # ============ Backend Legacy Service Routes ============
  - id: backend-service
    uri: /api/v1/*
    upstream:
      type: roundrobin
      nodes:
        - host: backend
          port: 8080
          weight: 100
    plugins:
      jwt-auth:
        key: user-key
      limit-req:
        rate: 200
        burst: 100
      proxy-rewrite:
        headers:
          X-Request-ID: $request_id
    metadata:
      desc: "Legacy backend service (fallback)"
