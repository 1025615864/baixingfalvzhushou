[pytest]
# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试发现配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试报告配置
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    -q
    --ignore=tests/e2e
    --ignore=tests/fix_async_tests.py
    --ignore=tests/conftest_income.py
    --ignore=tests/helpers
    # 并行测试 (需要 pytest-xdist)
    # -n auto

# 标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests (fast, no external dependencies)
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    database: marks tests that require database
    redis: marks tests that require Redis
    external: marks tests that call external APIs (slow)
    coverage: marks tests for coverage analysis
    performance: marks tests for performance testing

# 忽略目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    temp_test_files
    e2e
    .trash
    coverage_html
    .coverage
    helpers

# 日志配置 - 默认关闭以加速测试
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志（用于调试）
log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
# 启用方式: pytest --cov=app --cov-report=term-missing --cov-report=html
# 或使用别名: pytest -m coverage

# 测试超时（秒）- 防止单个测试卡住
timeout = 30
timeout_method = thread

# 失败时停止 - 快速失败模式
# 取消注释以下行以启用: -x
