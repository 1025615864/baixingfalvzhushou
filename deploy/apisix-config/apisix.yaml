# APISIX 限流与网关配置

> 适用版本: APISIX 3.x+
> 更新日期: 2026-05-06

---

## 1. 全局限流插件

### 1.1 请求限流 (limit-req)

```yaml
# apisix/conf/apisix.yaml
routes:
  - uri: /api/v1/auth/register
    methods: ["POST"]
    plugins:
      limit-req:
        rate: 5          # 每秒请求数
        burst: 10        # 突发请求数
        key: "remote_addr"
        rejected_code: 429
        rejected_msg: "注册请求过于频繁，请稍后重试"
    upstream:
      type: roundrobin
      nodes:
        "user-service:8001": 1

  - uri: /api/v1/auth/login
    methods: ["POST"]
    plugins:
      limit-req:
        rate: 10
        burst: 20
        key: "remote_addr"
        rejected_code: 429
        rejected_msg: "登录请求过于频繁，请稍后重试"
    upstream:
      type: roundrobin
      nodes:
        "user-service:8001": 1

  - uri: /api/v1/ai/chat
    methods: ["POST"]
    plugins:
      limit-req:
        rate: 20
        burst: 30
        key: "arg_user_id"
        rejected_code: 429
        rejected_msg: "AI 请求过于频繁，请稍后重试"
    upstream:
      type: roundrobin
      nodes:
        "ai-service:8005": 1

  - uri: /api/v1/search
    methods: ["GET"]
    plugins:
      limit-req:
        rate: 30
        burst: 50
        key: "remote_addr"
        rejected_code: 429
        rejected_msg: "搜索请求过于频繁，请稍后重试"
    upstream:
      type: roundrobin
      nodes:
        "search-service:8011": 1
```

### 1.2 并发限流 (limit-count)

```yaml
routes:
  - uri: /api/v1/upload/*
    methods: ["POST", "PUT"]
    plugins:
      limit-count:
        count: 100        # 时间窗口内最大请求数
        time_window: 60   # 时间窗口(秒)
        key: "remote_addr"
        rejected_code: 429
        rejected_msg: "文件上传请求过多，请稍后重试"
        policy: "local"
```

### 1.3 并发连接限流 (limit-conn)

```yaml
routes:
  - uri: /ws/*
    plugins:
      limit-conn:
        conn: 100         # 最大并发连接数
        burst: 50         # 突发连接数
        default_conn_delay: 0.1
        rejected_code: 429
        rejected_msg: "连接数过多，请稍后重试"
        key: "remote_addr"
```

