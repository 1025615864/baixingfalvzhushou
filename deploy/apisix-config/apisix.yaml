## 5. 服务发现 (Consul)

```yaml
discovery:
  consul:
    host:
      - "http://consul:8500"
    prefix: "/apisix/services/"
    timeout:
      connect: 2000
      read: 5000
    weight: 100
    health_check:
      timeout: 5
      interval: 10
      healthy: 3
      unhealthy: 3
```

---

## 6. 部署检查清单

- [ ] APISIX Dashboard 已配置管理员密码
- [ ] SSL 证书已配置 (Let's Encrypt 或商业证书)
- [ ] etcd 集群已部署 (3 节点)
- [ ] Prometheus 已配置抓取 APISIX 指标
- [ ] Grafana Dashboard 已导入
- [ ] 限流阈值已根据实际 QPS 调整
- [ ] IP 白名单已配置支付回调
- [ ] 日志格式已配置 JSON 格式
- [ ] CORS 域名已正确配置
- [ ] 健康检查端点已验证
