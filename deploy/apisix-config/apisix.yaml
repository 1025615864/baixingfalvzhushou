## 2. 路由与上游配置

### 2.1 后端服务路由

```yaml
routes:
  # 用户服务
  - uri: /api/v1/users/*
    upstream:
      type: roundrobin
      service_name: user-service
      discovery_type: consul
      discovery_args:
        service_name: user-service
        group: api-services

  # 法律服务
  - uri: /api/v1/legal/*
    upstream:
      type: roundrobin
      service_name: legal-service
      discovery_type: consul
      discovery_args:
        service_name: legal-service
        group: api-services

  # AI 服务
  - uri: /api/v1/ai/*
    upstream:
      type: roundrobin
      service_name: ai-service
      discovery_type: consul
      discovery_args:
        service_name: ai-service
        group: api-services

  # 订单服务
  - uri: /api/v1/orders/*
    upstream:
      type: roundrobin
      service_name: order-service
      discovery_type: consul
      discovery_args:
        service_name: order-service
        group: api-services

  # 支付服务
  - uri: /api/v1/payments/*
    upstream:
      type: roundrobin
      service_name: payment-channel-service
      discovery_type: consul
      discovery_args:
        service_name: payment-channel-service
        group: api-services
```

### 2.2 支付回调特殊路由 (绕过限流)

```yaml
routes:
  - uri: /api/v1/callbacks/alipay
    methods: ["POST"]
    plugins:
      ip-restriction:
        whitelist:
          - "103.52.76.0/24"
          - "103.52.77.0/24"
          - "110.76.16.0/24"
    upstream:
      type: roundrobin
      service_name: payment-channel-service
      discovery_type: consul
      discovery_args:
        service_name: payment-channel-service

  - uri: /api/v1/callbacks/wechat
    methods: ["POST"]
    plugins:
      ip-restriction:
        whitelist:
          - "203.205.219.0/24"
          - "203.205.220.0/24"
          - "203.205.221.0/24"
    upstream:
      type: roundrobin
      service_name: payment-channel-service
      discovery_type: consul
      discovery_args:
        service_name: payment-channel-service
```

