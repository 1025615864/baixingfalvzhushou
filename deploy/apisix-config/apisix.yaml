## 3. 安全插件

### 3.1 CORS 配置

```yaml
global_rules:
  cors:
    plugins:
      cors:
        allow_origins: "https://www.baixingfalv.com,https://m.baixingfalv.com"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-ID,X-Trace-ID"
        max_age: 3600
        allow_credentials: true
```

### 3.2 JWT 认证

```yaml
routes:
  - uri: /api/v1/*
    plugins:
      jwt-auth:
        header: Authorization
        query: token
        cookie: jwt_token
    upstream:
      type: roundrobin
      service_name: backend-bff
      discovery_type: consul
```

### 3.3 IP 黑名单

```yaml
global_rules:
  ip-blacklist:
    plugins:
      ip-restriction:
        blacklist:
          - "192.168.1.100"
          - "10.0.0.0/8"
```

