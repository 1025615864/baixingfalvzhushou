version: "3.8"

# 生产环境 Docker Compose 配置
# 包含完整的 AI 质量监控栈：Redis + Prometheus + Grafana + Alertmanager

services:
  # PostgreSQL数据库
  db:
    image: postgres:15-alpine
    container_name: baixing_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-baixing_law}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baixing_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
          pids: 200
        reservations:
          cpus: '1'
          memory: 1G
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  # Redis缓存（用于AI质量监控持久化、限流、分布式锁）
  redis:
    image: redis:7-alpine
    container_name: baixing_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - baixing_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baixing_backend_prod
    restart: always
    environment:
      # 数据库配置
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baixing_law}
      # 安全配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-["http://localhost"]}
      # AI 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Redis 配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      # 调试模式（生产必须为 false）
      - DEBUG=false
      # AI质量监控配置（生产环境启用Redis持久化）
      - AI_QUALITY_REDIS_ENABLED=true
      - AI_QUALITY_REDIS_KEY_PREFIX="ai_quality:"
      - AI_QUALITY_MAX_RECENT_LOGS=5000
      - AI_QUALITY_TTL_SECONDS=604800
      # Sentry 配置（可选）
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - baixing_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
          pids: 300
        reservations:
          cpus: '1'
          memory: 1G
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  # Prometheus监控服务
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: baixing_prometheus_prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/ai-quality-alerts.yml:/etc/prometheus/ai-quality-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--query.max-concurrency=10'
      - '--query.timeout=2m'
    networks:
      - baixing_network
    depends_on:
      - backend
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  # Grafana监控面板
  grafana:
    image: grafana/grafana:10.0.0
    container_name: baixing_grafana_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - baixing_network
    depends_on:
      - prometheus
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  # Alertmanager告警管理
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: baixing_alertmanager_prod
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
    networks:
      - baixing_network
    depends_on:
      - prometheus
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 50
        reservations:
          cpus: '0.25'
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  # 前端服务 (frontend-v2)
  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    container_name: baixing_frontend_prod
    image: baixing-assistant-frontend-v2-prod:latest
    restart: always
    ports:
      - "80:3000"
    networks:
      - baixing_network
    depends_on:
      - backend
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  # Nginx 反向代理（可选，用于生产环境HTTPStermination）
  # nginx:
  #   image: nginx:alpine
  #   container_name: baixing_nginx_prod
  #   restart: always
  #   ports:
  #     - "8080:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d:ro
  #   networks:
  #     - baixing_network
  #   depends_on:
  #     - frontend
  #     - backend
  #   # 生产环境资源限制
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 256M
  #   # 健康检查
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

networks:
  baixing_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  # Schemathesis 测试结果持久化
  schemathesis_results:
    driver: local
