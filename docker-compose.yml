name: baixing

# YAML扩展字段 - 通用配置
x-base-logging: &base-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-common-resource-limits: &common-resource-limits
  reservations:
    cpus: "0.25"
    memory: 256M

x-backend-logging: &backend-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"

x-microservice-security: &microservice-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE

services:
  # PostgreSQL数据库
  db:
    image: pgvector/pgvector:pg15
    container_name: baixing_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-baixing_law}
    command: >
      postgres
      -c shared_preload_libraries='vector'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-1}
          memory: ${DB_MEMORY_LIMIT:-1G}
          pids: 100
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: baixing_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-0.5}
          memory: ${REDIS_MEMORY_LIMIT:-512M}
          pids: 50
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network

  # Redis指标导出
  redis-exporter:
    image: oliver006/redis_exporter:v1.60.0
    container_name: baixing_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - "--redis.addr=redis://redis:6379"
      - "--redis.password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    expose:
      - "9121"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 50
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network
      - monitoring-network

  # Kafka 事件流平台
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: baixing_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: baixing_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        <<: *common-resource-limits
    logging: *backend-logging
    networks:
      - backend-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: baixing_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network

  # MinIO 对象存储 (S3 兼容)
  minio:
    image: minio/minio:latest
    container_name: baixing_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - backend-network

  # MinIO 初始化 (创建 bucket)
  minio-init:
    image: minio/mc:latest
    container_name: baixing_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/baixing-uploads;
      mc anonymous set download local/baixing-uploads;
      echo 'Bucket baixing-uploads created';
      "
    networks:
      - backend-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baixing_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-baixing_law}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      DEBUG: ${DEBUG:-true}
      CORS_ALLOW_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      DB_ALLOW_RUNTIME_DDL: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      AI_QUALITY_REDIS_ENABLED: ${AI_QUALITY_REDIS_ENABLED:-true}
      AI_QUALITY_REDIS_KEY_PREFIX: ${AI_QUALITY_REDIS_KEY_PREFIX:-ai_quality:}
      AI_QUALITY_MAX_RECENT_LOGS: ${AI_QUALITY_MAX_RECENT_LOGS:-1000}
      AI_QUALITY_TTL_SECONDS: ${AI_QUALITY_TTL_SECONDS:-604800}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8005}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-1.0.0}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9091}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      VERSION: ${VERSION:-1.0.0}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-baixing-uploads}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/baixing-uploads
      STORAGE_S3_PREFIX: uploads
    ports:
      - "8000:8000"
      - "9091:9091"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/sherpa_models:/app/data/sherpa_models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-2}
          memory: ${BACKEND_MEMORY_LIMIT:-2G}
          pids: 200
        reservations:
          cpus: "1"
          memory: 512M
    logging: *backend-logging
    networks:
      - backend-network
      - frontend-network

  # Prometheus监控服务
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: baixing_prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/ai-quality-alerts.yml:/etc/prometheus/ai-quality-alerts.yml:ro
      - ./prometheus/backend-alerts.yml:/etc/prometheus/backend-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - monitoring-network
      - backend-network

  # Grafana监控面板
  grafana:
    image: grafana/grafana:10.0.0
    container_name: baixing_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_DEFAULT_LANGUAGE=zh-Hans
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - monitoring-network

  # Alertmanager告警服务
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: baixing_alertmanager
    ports:
      - "9200:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 50
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - monitoring-network

  # 前端服务 (frontend-v2)
  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    container_name: baixing_frontend
    image: baixing-assistant-frontend-v2:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 50
        <<: *common-resource-limits
    logging: *base-logging
    networks:
      - frontend-network

  # ========================================
  # 微服务集群 (可选，注释掉以加快开发速度)
  # ========================================

  # 法律服务 (8008)
  legal-service:
    build:
      context: ./services/legal-service
      dockerfile: Dockerfile
    container_name: baixing_legal_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/legal_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8008:8008"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 社区服务 (8007)
  community-service:
    build:
      context: ./services/community-service
      dockerfile: Dockerfile
    container_name: baixing_community_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/community_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8007:8007"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 新闻服务 (8006)
  news-service:
    build:
      context: ./services/news-service
      dockerfile: Dockerfile
    container_name: baixing_news_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/news_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8006:8006"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 搜索服务 (8009)
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: baixing_search_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/search_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEWS_SERVICE_URL: http://news-service:8006
      COMMUNITY_SERVICE_URL: http://community-service:8007
      LEGAL_SERVICE_URL: http://legal-service:8008
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8081
      DEBUG: "true"
    ports:
      - "8009:8009"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 推荐服务 (8010)
  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: baixing_recommendation_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/recommendation_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEWS_SERVICE_URL: http://news-service:8006
      COMMUNITY_SERVICE_URL: http://community-service:8007
      LEGAL_SERVICE_URL: http://legal-service:8008
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8081
      DEBUG: "true"
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 通知服务 (8011)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: baixing_notification_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/notification_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 用户服务 (8001)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: baixing_user_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/user_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CONSUL_ENABLED: "false"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
    logging: *base-logging
    networks:
      - backend-network

  # 积分服务 (8012)
  points-service:
    build:
      context: ./services/points-service
      dockerfile: Dockerfile
    container_name: baixing_points_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/points_service
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "true"
    ports:
      - "8012:8012"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    <<: *microservice-security
