apiVersion: v2
name: baixing-assistant
description: Baixing Legal Assistant - Full microservices platform (BFF + 14 microservices + frontend)
type: application
version: 0.2.0
appVersion: "2.0.0"

dependencies:
  - name: redis
    version: 24.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 18.2.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: kafka
    version: 26.6.0
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: minio
    version: 14.7.0
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
