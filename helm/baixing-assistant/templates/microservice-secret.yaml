{{- range $name, $svc := .Values.microservices }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baixing-assistant.fullname" $ }}-{{ $name }}-secret
  labels:
{{ include "baixing-assistant.labels" $ | indent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
stringData:
  DATABASE_URL: {{ $svc.secret.DATABASE_URL | default "" | quote }}
  REDIS_URL: {{ $svc.secret.REDIS_URL | default "" | quote }}
{{- if $svc.secret.EXTRA }}
{{ toYaml $svc.secret.EXTRA | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
