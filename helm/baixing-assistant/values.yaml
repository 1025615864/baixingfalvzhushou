replicaCount:
  backend: 2
  frontend: 2

image:
  backend:
    repository: baixing-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: baixing-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 3000

resources:
  backend: {}
  frontend: {}

autoscaling:
  enabled: true
  targetBackend: backend
  targetFrontend: frontend
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  targetRequestsPerSecond: 1000
  requestsPerSecondMetric: "http_server_requests_seconds_sum"
  scaleDownStabilizationWindowSeconds: 300
  scaleUpStabilizationWindowSeconds: 0
  scaleDownPolicies:
    - type: Percent
      value: 10
      periodSeconds: 60
  scaleUpPolicies:
    - type: Percent
      value: 100
      periodSeconds: 15
    - type: Pods
      value: 4
      periodSeconds: 15
  scaleUpSelectPolicy: Max

backend:
  existingSecretName: ""

  externalSecret:
    enabled: false
    secretStoreRef:
      name: ""
      kind: SecretStore
    refreshInterval: 1h
    remoteRefs:
      DATABASE_URL: ""
      JWT_SECRET_KEY: ""
      PAYMENT_WEBHOOK_SECRET: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      CRITICAL_EVENTS_WEBHOOK_URL: ""
      CRITICAL_EVENTS_WEBHOOK_BEARER: ""
      CRITICAL_EVENTS_WEBHOOK_HEADER_VALUE: ""

  config:
    DEBUG: "false"
    CORS_ALLOW_ORIGINS: "https://yourdomain.com"
    FRONTEND_BASE_URL: "https://yourdomain.com"
    TRUSTED_PROXIES: "[]"
    NEWS_AI_ENABLED: "true"
    NEWS_AI_INTERVAL_SECONDS: "120"
    OPENAI_BASE_URL: "https://api.openai.com/v1"
    AI_MODEL: "deepseek-chat"
    CRITICAL_EVENTS_ENABLED: "false"
    CRITICAL_EVENTS_MIN_INTERVAL_SECONDS: "30"
    CRITICAL_EVENTS_TIMEOUT_SECONDS: "3"
    CRITICAL_EVENTS_WEBHOOK_HEADER_NAME: ""

  secret:
    DATABASE_URL: ""
    JWT_SECRET_KEY: ""
    PAYMENT_WEBHOOK_SECRET: ""
    REDIS_URL: ""
    OPENAI_API_KEY: ""
    CRITICAL_EVENTS_WEBHOOK_URL: ""
    CRITICAL_EVENTS_WEBHOOK_BEARER: ""
    CRITICAL_EVENTS_WEBHOOK_HEADER_VALUE: ""

ingress:
  enabled: true
  className: nginx
  host: yourdomain.com
  tls:
    enabled: true
    secretName: yourdomain-tls

redis:
  enabled: false

postgresql:
  enabled: false

kafka:
  enabled: true
  bootstrapServers: "kafka:29092"

minio:
  enabled: false
  endpoint: "http://minio:9000"
  bucket: "baixing-uploads"

global:
  imageTag: latest

microservices:
  user-service:
    enabled: true
    replicaCount: 2
    image:
      repository: baixing-user-service
      tag: latest
    service:
      type: ClusterIP
      port: 8001
    kafka:
      enabled: true
    config:
      DEBUG: "false"
      CORS_ORIGINS: "https://yourdomain.com"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    secret:
      DATABASE_URL: ""
      REDIS_URL: ""

  order-service:
