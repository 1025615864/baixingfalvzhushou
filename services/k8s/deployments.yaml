# K8s Deployment 配置模板

## user-service Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bxzs-prod
  labels:
    app: user-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [user-service]
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: user-service
        image: registry.cn-hangzhou.aliyuncs.com/bxzs/user-service:v1
        ports:
        - containerPort: 8001
        
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bxzs-secrets
              key: user-db-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: bxzs-secrets
              key: redis-url
        - name: JWT_RSA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: bxzs-secrets
              key: jwt-private-key
        - name: JWT_RSA_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: bxzs-secrets
              key: jwt-public-key
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          failureThreshold: 12
          periodSeconds: 5
```

