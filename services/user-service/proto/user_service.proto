syntax = "proto3";

package user;

option go_package = "github.com/baixingfalvzhushou/services/user-service/proto";

service UserService {
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserResponse);
    rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
    rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
    rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
    rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
    rpc BanUser(BanUserRequest) returns (BanUserResponse);
    rpc UpdateMembership(UpdateMembershipRequest) returns (UpdateMembershipResponse);
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message GetUserRequest {
    int64 user_id = 1;
    string uid = 2;
}

message GetUserByUsernameRequest {
    string username = 1;
}

message BatchGetUsersRequest {
    repeated int64 user_ids = 1;
}

message BatchGetUsersResponse {
    repeated User users = 1;
    repeated int64 not_found_ids = 2;
}

message User {
    int64 id = 1;
    string uid = 2;
    string username = 3;
    string email = 4;
    string phone = 5;
    string nickname = 6;
    string role = 7;
    string status = 8;
    bool is_active = 9;
    bool email_verified = 10;
    bool phone_verified = 11;
    string avatar = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
}

message GetUserResponse {
    int64 id = 1;
    string uid = 2;
    string username = 3;
    string email = 4;
    string phone = 5;
    string nickname = 6;
    string role = 7;
    string status = 8;
    bool is_active = 9;
    bool email_verified = 10;
    bool phone_verified = 11;
    string avatar = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    bool valid = 1;
    int64 user_id = 2;
    string uid = 3;
    string role = 4;
    string error = 5;
}

message CheckPermissionRequest {
    int64 user_id = 1;
    string required_role = 2;
}

message CheckPermissionResponse {
    bool allowed = 1;
    string reason = 2;
}

message GetUserProfileRequest {
    int64 user_id = 1;
}

message GetUserProfileResponse {
    int64 id = 1;
    int64 user_id = 2;
    string nickname = 3;
    string avatar = 4;
    string bio = 5;
    string gender = 6;
    string birthday = 7;
    string province = 8;
    string city = 9;
}

message UpdateUserProfileRequest {
    int64 user_id = 1;
    string nickname = 2;
    string avatar = 3;
    string bio = 4;
    string gender = 5;
    string birthday = 6;
    string province = 7;
    string city = 8;
}

message UpdateUserProfileResponse {
    bool success = 1;
    string message = 2;
}

message UpdateUserRoleRequest {
    int64 user_id = 1;
    string new_role = 2;
    string operator_id = 3;
    string reason = 4;
}

message UpdateUserRoleResponse {
    bool success = 1;
    string message = 2;
    string old_role = 3;
    string new_role = 4;
}

message BanUserRequest {
    int64 user_id = 1;
    string operator_id = 2;
    string reason = 3;
    int64 ban_duration_hours = 4;
}

message BanUserResponse {
    bool success = 1;
    string message = 2;
    string ban_end_at = 3;
}

message UpdateMembershipRequest {
    int64 user_id = 1;
    string tier = 2;
    int64 vip_expires_at = 3;
    string operator_id = 4;
    string reason = 5;
}

message UpdateMembershipResponse {
    bool success = 1;
    string message = 2;
    string old_tier = 3;
    string new_tier = 4;
}

message HealthCheckRequest {
    string service_name = 1;
}

message HealthCheckResponse {
    bool healthy = 1;
    string status = 2;
    int64 timestamp = 3;
    map<string, string> metadata = 4;
}
